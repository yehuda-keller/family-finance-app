<div
  *ngIf="toastService.message"
  class="toast"
  role="status"
  [class.toast-error]="toastService.type === 'error'"
>
  {{ toastService.message }}
</div>

<router-outlet></router-outlet>

<nav class="bottom-nav" *ngIf="showNav()" aria-label="ניווט ראשי">
  <a routerLink="/dashboard" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
    </svg>
    <span>בית</span>
  </a>
  <a routerLink="/import" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
    </svg>
    <span>ייבוא</span>
  </a>
  <a routerLink="/shopping" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2" />
      <circle cx="10" cy="20.5" r="1" />
      <circle cx="17" cy="20.5" r="1" />
    </svg>
    <span>קניות</span>
  </a>
</nav>
