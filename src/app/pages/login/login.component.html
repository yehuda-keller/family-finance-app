<div class="login">
  <div class="brand">
    <div class="logo">💸</div>
    <h1>הכספים שלנו</h1>
    <p>ניהול הכנסות והוצאות של המשפחה</p>
  </div>

  <form class="card login-card" (ngSubmit)="login()">
    <input class="field" type="email" name="email" placeholder="אימייל" autocomplete="email" inputmode="email" dir="ltr" [(ngModel)]="email" />
    <input class="field" type="password" name="password" placeholder="סיסמה" autocomplete="current-password" dir="ltr" [(ngModel)]="password" />

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
      {{ loading ? "מתחבר..." : "כניסה" }}
    </button>
  </form>
</div>
